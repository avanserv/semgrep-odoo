# Version updates, which are a separate thing from Dependabot alerts: an alert says a dependency is
# vulnerable and stops there. Everything is grouped and weekly, and every ecosystem sets a
# seven-day cooldown, so this file never adopts a release faster than its ecosystem can withdraw
# it. The `build` prefix keeps the squash commit a conventional one that bumps no version.
version: 2
updates:
  # The one that pays for the hash pins .github/zizmor.yml requires.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # uv.lock pins what CI tests against. A consumer's hook environment resolves the ranges in
  # pyproject.toml afresh, so this keeps CI close to what consumers install.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      python:
        patterns: ["*"]
